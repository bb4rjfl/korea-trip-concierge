<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta
      name="description"
      content="Korea Trip Concierge — a real-time conversational travel guide for visitors in Korea. Live transit, weather pivots, menus, payments, and what's open right now."
    />
    <link rel="icon" type="image/png" href="/icon-192.png" />

    <!-- Shared into a KakaoTalk chat or a message thread, a link with no card is
         a link nobody taps. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Korea Trip Concierge" />
    <meta property="og:url" content="https://ktc.tacita.cloud/" />
    <meta property="og:title" content="Korea Trip Concierge — real-time help while you travel in Korea" />
    <meta
      property="og:description"
      content="Live subway and bus arrivals, routes with real fares, what's open right now, menus and allergens, payments that actually work for a foreign card. English, 日本語, 中文, 한국어."
    />
    <meta property="og:image" content="https://ktc.tacita.cloud/icon-512.png" />
    <meta property="og:locale" content="en" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Korea Trip Concierge" />
    <meta
      name="twitter:description"
      content="Real-time travel help in Korea — transit, opening hours, menus, payments. Four languages, no sign-up."
    />
    <meta name="twitter:image" content="https://ktc.tacita.cloud/icon-512.png" />

    <title>Korea Trip Concierge</title>
